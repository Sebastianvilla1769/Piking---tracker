<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Picking Tracker</title><style>:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#15803d;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:var(--bg);color:var(--text)}main{max-width:600px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:27px}.sub,.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 3px 14px #00000008}.big{text-align:center;font-size:58px;font-weight:800}.timer{text-align:center;font-size:22px;margin:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f8fafc;border-radius:14px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.row{display:flex;gap:9px}.row>*{flex:1}button,input,select{border:0;border-radius:14px;padding:13px;font:inherit}button{background:#111827;color:#fff;font-weight:700}button:disabled{opacity:.45}button.green{background:#dcfce7;color:var(--green)}button.red{background:#fee2e2;color:var(--red)}input,select{background:#eef0f3;color:#111827;width:100%}.pill{display:inline-block;background:#eef0f3;border-radius:999px;padding:7px 10px;margin:3px;font-size:13px}.history{border-top:1px solid var(--line);padding:13px 0}.history:first-child{border-top:0}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;padding:10px}.modal>div{background:white;border-radius:22px;padding:18px;width:min(600px,100%);max-height:90vh;overflow:auto}.hide{display:none}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:#111827;width:0}</style></head><body><main>
<div class="top"><div><h1>📦 Picking Tracker</h1><div class="sub" id="date"></div></div><select id="lang" onchange="setLang(this.value)"><option value="es">🇪🇸 Español</option><option value="uk">🇺🇦 Українська</option><option value="vi">🇻🇳 Tiếng Việt</option><option value="en">🇬🇧 English</option><option value="ru">🇷🇺 Русский</option></select></div>
<section class="card"><div class="sub" data-t="today"></div><div class="big" id="boxes">0</div><div class="timer" id="timer">00:00:00</div><div class="row"><button id="start" onclick="start()" data-t="start"></button><button id="pause" onclick="pause()" data-t="pause"></button></div><button class="green" style="width:100%;margin-top:9px" onclick="finish()" data-t="finish"></button></section>
<section class="card"><h3 data-t="orders"></h3><div class="row"><input id="order" type="number" min="0" inputmode="numeric" placeholder="370"><button onclick="add()" data-t="add"></button></div><div id="ordersList"></div><div class="row"><button onclick="undo()" data-t="undo"></button><button class="red" onclick="clearDay()" data-t="clear"></button></div></section>
<section class="card"><h3 data-t="goal"></h3><input id="goal" type="number" min="0" inputmode="numeric" onchange="setGoal()"><div class="sub" id="goalText"></div><div class="bar"><div id="goalBar"></div></div></section>
<section class="card"><h3 data-t="summary"></h3><div class="row"><button onclick="period='week';render()" data-t="week"></button><button onclick="period='month';render()" data-t="month"></button></div><div class="grid" style="margin-top:10px"><div class="stat"><span class="sub" data-t="total"></span><b id="ptotal">0</b></div><div class="stat"><span class="sub" data-t="days"></span><b id="pdays">0</b></div><div class="stat"><span class="sub" data-t="hours"></span><b id="phours">00:00:00</b></div><div class="stat"><span class="sub" data-t="avgday"></span><b id="pavgday">0</b></div><div class="stat"><span class="sub" data-t="avghour"></span><b id="pavghour">0</b></div><div class="stat"><span class="sub" data-t="best"></span><b id="pbest">0</b></div></div><button class="green" style="width:100%;margin-top:10px" onclick="closeMonth()" data-t="closemonth"></button></section>
<section class="card"><h3 data-t="history"></h3><div id="history"></div></section><section class="card"><h3 data-t="final"></h3><div id="closed"></div></section></main>
<div id="modal" class="modal hide"><div><div class="top"><h3 id="mt"></h3><button onclick="closeModal()">✕</button></div><div id="mb"></div></div></div>
<script>
const T={es:{today:'Producción de hoy',start:'▶️ Iniciar turno',pause:'⏸️ Pausa',resume:'▶️ Continuar',finish:'✅ Terminar turno',orders:'Pedidos / cajas',add:'Agregar',undo:'↩️ Deshacer último',clear:'🧹 Borrar día',goal:'🎯 Meta de cajas',summary:'📊 Resumen',week:'Semana',month:'Mes',total:'Total cajas',days:'Días trabajados',hours:'Horas trabajadas',avgday:'Promedio cajas/día',avghour:'Promedio cajas/h',best:'Mejor día',closemonth:'🔒 Cerrar mes y guardar producción definitiva',history:'📜 Historial',final:'🏆 Producciones definitivas',edit:'Editar',del:'Eliminar',no:'Todavía no hay días guardados.',noFinal:'Todavía no hay meses cerrados.',confirm:'¿Eliminar este día?',saved:'Producción mensual guardada.'},en:{today:"Today's production",start:'▶️ Start shift',pause:'⏸️ Pause',resume:'▶️ Resume',finish:'✅ Finish shift',orders:'Orders / boxes',add:'Add',undo:'↩️ Undo last',clear:'🧹 Clear day',goal:'🎯 Box goal',summary:'📊 Summary',week:'Week',month:'Month',total:'Total boxes',days:'Days worked',hours:'Hours worked',avgday:'Average boxes/day',avghour:'Average boxes/h',best:'Best day',closemonth:'🔒 Close month & save final production',history:'📜 History',final:'🏆 Final productions',edit:'Edit',del:'Delete',no:'No saved days yet.',noFinal:'No closed months yet.',confirm:'Delete this day?',saved:'Monthly production saved.'},uk:{today:'Виробництво сьогодні',start:'▶️ Почати зміну',pause:'⏸️ Пауза',resume:'▶️ Продовжити',finish:'✅ Завершити зміну',orders:'Замовлення / коробки',add:'Додати',undo:'↩️ Скасувати останнє',clear:'🧹 Очистити день',goal:'🎯 Мета коробок',summary:'📊 Підсумок',week:'Тиждень',month:'Місяць',total:'Всього коробок',days:'Робочі дні',hours:'Відпрацьовано',avgday:'Середнє коробок/день',avghour:'Середнє коробок/год',best:'Найкращий день',closemonth:'🔒 Закрити місяць і зберегти результат',history:'📜 Історія',final:'🏆 Збережені результати',edit:'Редагувати',del:'Видалити',no:'Немає збережених днів.',noFinal:'Немає закритих місяців.',confirm:'Видалити цей день?',saved:'Місячний результат збережено.'},vi:{today:'Sản lượng hôm nay',start:'▶️ Bắt đầu ca',pause:'⏸️ Tạm dừng',resume:'▶️ Tiếp tục',finish:'✅ Kết thúc ca',orders:'Đơn hàng / thùng',add:'Thêm',undo:'↩️ Hoàn tác',clear:'🧹 Xóa ngày',goal:'🎯 Mục tiêu thùng',summary:'📊 Tổng kết',week:'Tuần',month:'Tháng',total:'Tổng thùng',days:'Ngày làm',hours:'Giờ làm',avgday:'Trung bình thùng/ngày',avghour:'Trung bình thùng/giờ',best:'Ngày tốt nhất',closemonth:'🔒 Đóng tháng và lưu kết quả',history:'📜 Lịch sử',final:'🏆 Kết quả cuối',edit:'Sửa',del:'Xóa',no:'Chưa có ngày lưu.',noFinal:'Chưa có tháng đóng.',confirm:'Xóa ngày này?',saved:'Đã lưu kết quả tháng.'},ru:{today:'Производство сегодня',start:'▶️ Начать смену',pause:'⏸️ Пауза',resume:'▶️ Продолжить',finish:'✅ Завершить смену',orders:'Заказы / коробки',add:'Добавить',undo:'↩️ Отменить последнее',clear:'🧹 Очистить день',goal:'🎯 Цель коробок',summary:'📊 Итоги',week:'Неделя',month:'Месяц',total:'Всего коробок',days:'Рабочих дней',hours:'Отработано',avgday:'Среднее коробок/день',avghour:'Среднее коробок/час',best:'Лучший день',closemonth:'🔒 Закрыть месяц и сохранить результат',history:'📜 История',final:'🏆 Итоговые результаты',edit:'Изменить',del:'Удалить',no:'Сохранённых дней пока нет.',noFinal:'Закрытых месяцев пока нет.',confirm:'Удалить этот день?',saved:'Месячный результат сохранён.'}};
let lang=localStorage.getItem('pt_lang')||'es',goal=Number(localStorage.getItem('pt_goal')||25000),days=JSON.parse(localStorage.getItem('pt_days')||'{}'),closed=JSON.parse(localStorage.getItem('pt_closed')||'{}'),period='week';let s=JSON.parse(localStorage.getItem('pt_state')||'null')||{orders:[],elapsed:0,running:false,paused:false,start:null,day:null};
const $=x=>document.getElementById(x),key=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem('pt_state',JSON.stringify(s));localStorage.setItem('pt_days',JSON.stringify(days));localStorage.setItem('pt_closed',JSON.stringify(closed))}function n(x){return Number(x||0).toLocaleString('es-ES')}function sec(){return Math.max(0,Math.floor((s.elapsed||0)+(s.running&&s.start?(Date.now()-s.start)/1000:0)))}function time(x){x=Math.floor(x);let h=Math.floor(x/3600),m=Math.floor(x%3600/60),z=x%60;return [h,m,z].map(v=>String(v).padStart(2,'0')).join(':')}function total(){return s.orders.reduce((a,b)=>a+Number(b),0)}function rate(b,seconds){return seconds?b/(seconds/3600):0}function tr(k){return T[lang][k]||T.es[k]}
function setLang(v){lang=v;localStorage.setItem('pt_lang',v);render()}function start(){if(!s.day)s.day=key();s.running=true;s.paused=false;s.start=Date.now();save();render()}function pause(){if(!s.running)return;if(s.paused){s.running=true;s.paused=false;s.start=Date.now()}else{s.elapsed=sec();s.running=false;s.paused=true}s.start=s.running?Date.now():null;save();render()}function finish(){if(!s.day&&!s.orders.length)return;days[s.day||key()]={date:s.day||key(),boxes:total(),seconds:sec(),orders:[...s.orders]};s={orders:[],elapsed:0,running:false,paused:false,start:null,day:null};save();render()}function add(){let v=Number($('order').value);if(v<=0)return;if(!s.day)s.day=key();s.orders.push(v);$('order').value='';save();render()}function undo(){s.orders.pop();save();render()}function clearDay(){if(confirm(tr('confirm'))){delete days[key()];s={orders:[],elapsed:0,running:false,paused:false,start:null,day:null};save();render()}}function setGoal(){goal=Number($('goal').value||0);localStorage.setItem('pt_goal',goal);render()}
function rows(){let a=Object.values(days);if(period==='week'){let now=new Date(),m=new Date(now);m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));a=a.filter(x=>new Date(x.date+'T12:00:00')>=m)}else a=a.filter(x=>x.date.slice(0,7)===key().slice(0,7));if(s.day){let live={date:s.day,boxes:total(),seconds:sec()};let i=a.findIndex(x=>x.date===s.day);i>=0?a[i]=live:a.push(live)}return a}function render(){document.documentElement.lang=lang;$('lang').value=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));$('date').textContent=new Date().toLocaleDateString(lang==='es'?'es-ES':lang,{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('boxes').textContent=n(total());$('timer').textContent=time(sec());$('start').disabled=s.running;$('pause').textContent=tr(s.paused?'resume':'pause');$('pause').disabled=!s.day;$('goal').value=goal;$('goalText').textContent=`${n(total())} / ${n(goal)} (${goal?(total()/goal*100).toFixed(1):0}%)`;$('goalBar').style.width=(goal?Math.min(100,total()/goal*100):0)+'%';$('ordersList').innerHTML=s.orders.map((v,i)=>`<span class=pill>#${i+1}: ${n(v)}</span>`).join('');let a=rows(),tb=a.reduce((x,y)=>x+y.boxes,0),ts=a.reduce((x,y)=>x+y.seconds,0);$('ptotal').textContent=n(tb);$('pdays').textContent=a.filter(x=>x.boxes>0).length;$('phours').textContent=time(ts);$('pavgday').textContent=n(a.length?Math.round(tb/a.length):0);$('pavghour').textContent=n(Math.round(rate(tb,ts)));$('pbest').textContent=n(a.length?Math.max(...a.map(x=>x.boxes)):0);renderHistory();renderClosed()}
function renderHistory(){let a=Object.values(days).sort((x,y)=>y.date.localeCompare(x.date));$('history').innerHTML=a.length?a.map(x=>`<div class=history><b>${x.date}</b> — <b>${n(x.boxes)} 📦</b><div class=muted>${time(x.seconds)} · ${Math.round(rate(x.boxes,x.seconds)).toLocaleString('es-ES')} cajas/h</div><div class=row style="margin-top:8px"><button onclick="editDay('${x.date}')">✏️ ${tr('edit')}</button><button class=red onclick="delDay('${x.date}')">🗑️ ${tr('del')}</button></div></div>`).join(''):`<div class=muted>${tr('no')}</div>`}function delDay(k){if(confirm(tr('confirm'))){delete days[k];save();render()}}function editDay(k){let x=days[k];$('mt').textContent=tr('edit')+' '+k;$('mb').innerHTML=`<input id=eb type=number value="${x.boxes}"><input id=es type=number value="${x.seconds}" style="margin-top:8px"><button class=green style="width:100%;margin-top:8px" onclick="saveEdit('${k}')">💾 ${tr('edit')}</button>`;$('modal').classList.remove('hide')}function saveEdit(k){days[k].boxes=Number($('eb').value||0);days[k].seconds=Number($('es').value||0);save();closeModal();render()}function closeModal(){$('modal').classList.add('hide')}function closeMonth(){let mk=key().slice(0,7),a=Object.values(days).filter(x=>x.date.slice(0,7)===mk);if(s.day&&s.day.slice(0,7)===mk)a.push({date:s.day,boxes:total(),seconds:sec()});let tb=a.reduce((x,y)=>x+y.boxes,0),ts=a.reduce((x,y)=>x+y.seconds,0);closed[mk]={month:mk,total:tb,days:a.filter(x=>x.boxes>0).length,seconds:ts,avgDay:a.length?tb/a.length:0,avgHour:rate(tb,ts),best:a.length?Math.max(...a.map(x=>x.boxes)):0};save();render();alert(tr('saved'))}function renderClosed(){let a=Object.values(closed).sort((x,y)=>y.month.localeCompare(x.month));$('closed').innerHTML=a.length?a.map(x=>`<div class=history><b>${x.month}</b><div class=grid style="margin-top:8px"><div class=stat><span class=sub>${tr('total')}</span><b>${n(x.total)}</b></div><div class=stat><span class=sub>${tr('days')}</span><b>${x.days}</b></div><div class=stat><span class=sub>${tr('hours')}</span><b>${time(x.seconds)}</b></div><div class=stat><span class=sub>${tr('avghour')}</span><b>${Math.round(x.avgHour).toLocaleString('es-ES')}</b></div></div></div>`).join(''):`<div class=muted>${tr('noFinal')}</div>`}
setInterval(()=>{if(s.running){$('timer').textContent=time(sec());let a=rows(),tb=a.reduce((x,y)=>x+y.boxes,0),ts=a.reduce((x,y)=>x+y.seconds,0);$('pavghour').textContent=n(Math.round(rate(tb,ts)))}},1000);render();
</script></body></html>
